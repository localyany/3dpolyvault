<script>


// LOAD USER


let user = JSON.parse(
localStorage.getItem("polyvault_user")
);



if(!user){

window.location.href="login.html";

}



// USER DATA


document.getElementById("username").innerText =
user.username || "User";



document.getElementById("studioName").innerText =
user.studio || ((user.username || "User") + " Studio");



document.getElementById("email").innerText =
user.email || "No email";



document.getElementById("avatar").innerText =
(user.username || "U")
.charAt(0)
.toUpperCase();



document.getElementById("models").innerText =
user.models || 0;





// MENU


function showPage(page, element){


let pages =
document.querySelectorAll("main > div");



pages.forEach(function(item){

item.classList.add("hidden");

});



document
.getElementById(page)
.classList.remove("hidden");



let menu =
document.querySelectorAll(".menu");



menu.forEach(function(item){

item.classList.remove("active");

});



element.classList.add("active");


}





// LOGOUT


function logout(){

localStorage.removeItem(
"polyvault_user"
);


window.location.href="login.html";

}





// THEME SWITCH


let themeToggle =
document.getElementById("themeToggle");


let themeText =
document.querySelector(".theme-box span");



let savedTheme =
localStorage.getItem("polyvault_theme");



if(savedTheme === "light"){


document.body.classList.add("light");


if(themeToggle){

themeToggle.checked = true;

}


if(themeText){

themeText.innerText = "Light Theme";

}


}






if(themeToggle){


themeToggle.addEventListener(
"change",
function(){



if(this.checked){


document.body.classList.add("light");


localStorage.setItem(
"polyvault_theme",
"light"
);



themeText.innerText =
"Light Theme";


}

else{


document.body.classList.remove("light");


localStorage.setItem(
"polyvault_theme",
"dark"
);



themeText.innerText =
"Dark Theme";


}


}

);


}



</script>
