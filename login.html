<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Login - PolyVault</title>

<link rel="stylesheet" href="auth.css">

</head>


<body>


<div class="auth-box">


<img src="assets/logo.png" class="auth-logo">


<h1>
Welcome Back
</h1>



<input id="email" placeholder="Email">


<input id="password" 
type="password"
placeholder="Password">



<button onclick="login()">
Sign In
</button>



<p>
No account?
<a href="register.html">
Create one
</a>
</p>


</div>



<script>


function login(){


let user =
JSON.parse(
localStorage.getItem("polyvault_user")
);



if(!user){

alert("No account found");

return;

}



let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



if(
email===user.email &&
password===user.password
){


window.location.href="dashboard.html";


}
else{


alert("Wrong login");


}



}


</script>


</body>

</html>
